[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "eloup-wizard"
version = "0.1.0"
description = "EloUp deployment wizard — preflight, secret collection, GitOps deploy."
requires-python = ">=3.11"
dependencies = [
    "click>=8.1.7,<9",
    "rich>=13.7.0,<14",
    "PyYAML>=6.0.1,<7",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0,<9",
    "ruff>=0.5.0,<1",
]

[project.scripts]
eloup-wizard = "wizard.cli:main"

[tool.setuptools]
packages = ["wizard", "wizard.phases"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
pythonpath = ["."]
